[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smallgr"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "axolotl==0.12.2",
    "torch==2.8.0",
    "transformers==4.57.1",
    "datasets==4.5.0",
    "accelerate==1.12.0",
    "wandb==0.23.1",
    "numpy==2.2.0",
    "sentencepiece==0.2.1",
    "PyYAML==6.0.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.uv]
override-dependencies = [
    "torch==2.8.0",
    "transformers==4.57.1",
    "datasets==4.5.0",
    "accelerate==1.12.0",
    "peft==0.18.0",
    "trl==0.26.1",
    "numpy==2.2.0",
    "bitsandbytes==0.49.0",
    "xformers==0.0.32.post1",
    "triton==3.4.0",
    "torchao==0.9.0",
    "pydantic==2.12.5",
    "scikit-learn==1.8.0",
    "axolotl-contribs-lgpl==0.0.7",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
xformers = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
